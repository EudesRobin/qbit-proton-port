# Runs the harness on every push to main and every pull request (AGENTS.md, Harness).
# Proton VPN and qBittorrent are absent here: only the offline checks run.
name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      # Actions are pinned to a commit SHA: a tag can be moved to other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # nothing is pushed: don't leave the token in .git/config
      - run: .\harness\Invoke-Harness.ps1
