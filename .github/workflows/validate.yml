# Runs the harness on every push to main, every pull request and on demand (AGENTS.md, Harness).
# Proton VPN and qBittorrent are absent here: only the offline checks run.
# The harness groups its log per check, annotates problems on their file and line, and fills the job summary.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its previous run; runs on main always complete.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job name is the check required by the protection of main: don't rename it.
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      # Actions are pinned to a commit SHA: a tag can be moved to other code.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the whole history: the commits of the range below must be readable
          persist-credentials: false  # nothing is pushed: don't leave the token in .git/config
      - name: Install the harness tools (zizmor)
        run: python -m pip install --disable-pip-version-check -r harness/requirements.txt
      - name: Run the offline harness (consistency, secrets, workflows, commit messages, tests of the checks)
        env:
          # Commits whose messages are checked: those of the pull request, or those pushed to main (squash
          # messages written on GitHub). Dependabot's pull requests are skipped: their messages are rewritten
          # at squash, then checked on main. Passed through the environment, never expanded in the script.
          COMMIT_RANGE: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || github.event_name == 'push' && format('{0}..{1}', github.event.before, github.event.after) || '' }}
        run: .\harness\Invoke-Harness.ps1 -CommitRange $env:COMMIT_RANGE
