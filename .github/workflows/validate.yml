# Runs the harness on every push to main, every pull request and on demand (AGENTS.md, Harness).
# Proton VPN and qBittorrent are absent here: only the offline checks run.
# The harness groups its log per check, annotates problems on their file and line, and fills the job summary.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its previous run; runs on main always complete.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job name is the check required by the protection of main: don't rename it.
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      # Actions are pinned to a commit SHA: a tag can be moved to other code.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # nothing is pushed: don't leave the token in .git/config
      - name: Run the offline harness (consistency, secrets, tests of the checks)
        run: .\harness\Invoke-Harness.ps1
